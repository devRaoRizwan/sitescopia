<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/site-scopia.svg" />
    <link rel="canonical" href="https://sitescopia.online/" />

    <title>Free Website Analyzer: SEO, Speed and Security | SiteScopia</title>
    <meta
      name="description"
      content="Check any page for SEO, accessibility, security, speed and domain problems in seconds. Free, no signup, and every finding shows the evidence behind it."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4338ca" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SiteScopia" />
    <meta property="og:title" content="Free Website Analyzer: SEO, Speed and Security | SiteScopia" />
    <meta
      property="og:description"
      content="Check any page for SEO, accessibility, security, speed and domain problems in seconds. Free, no signup, and every finding shows the evidence behind it."
    />
    <meta property="og:url" content="https://sitescopia.online/" />
    <meta property="og:image" content="https://sitescopia.online/site-scopia.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Website Analyzer: SEO, Speed and Security | SiteScopia" />
    <meta
      name="twitter:description"
      content="Check any page for SEO, accessibility, security, speed and domain problems in seconds."
    />
    <meta name="twitter:image" content="https://sitescopia.online/site-scopia.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://sitescopia.online/#website",
            "url": "https://sitescopia.online/",
            "name": "SiteScopia",
            "description": "Free website analyzer for SEO, accessibility, security, performance and domain checks.",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://sitescopia.online/#app",
            "name": "SiteScopia",
            "url": "https://sitescopia.online/",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "description": "Analyze any web page for SEO, accessibility, security, performance, content, domain and contact issues. Every finding includes the evidence behind it.",
            "featureList": [
              "SEO audit including title, meta description, headings, canonical and Open Graph",
              "Accessibility checks for alt text, heading order, link text and mobile viewport",
              "Security header and HTTPS analysis",
              "Performance signals including response time, page size and compression",
              "Domain registration, expiry, DNS and DNSSEC lookup",
              "Social profile, email and phone extraction"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://sitescopia.online/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is SiteScopia free to use?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. There is no signup and no limit on how many pages you can check."
                }
              },
              {
                "@type": "Question",
                "name": "What does a website analysis check?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Every scan runs checks across seven areas: SEO, accessibility, security, performance, content, domain registration and published contact details."
                }
              },
              {
                "@type": "Question",
                "name": "Can it analyze a site built with JavaScript?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "We read the HTML the server sends without running JavaScript. If a page renders its content client-side we say so in the report rather than reporting the content as missing."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
